# Vsako noč pobere dogodke z virov, shrani podatke v repozitorij in objavi stran na GitHub Pages.
name: Posodobi napovednik

on:
  schedule:
    - cron: "23 2 * * *"  # 2.23 UTC = 4.23 poleti oz. 3.23 pozimi po slovenskem času
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: posodobi
  cancel-in-progress: false

jobs:
  posodobi:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      AI_MODEL: ${{ vars.AI_MODEL }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Namesti knjižnice
        run: |
          pip install -r requirements.txt
          if [ -n "$ANTHROPIC_API_KEY" ]; then pip install anthropic; fi
      - name: Poberi dogodke
        run: python -m zbiralnik
      - name: Shrani podatke
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add podatki
          if ! git diff --cached --quiet; then
            git commit -m "Podatki $(date -u +%Y-%m-%d)"
            git pull --rebase && git push
          fi
      - name: Zgradi stran
        run: python stran/build.py
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v5
